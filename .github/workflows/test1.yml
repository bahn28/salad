name: Test Notebook Run

on:
  schedule:
    # 매일 오전 9시 KST 실행 → UTC로는 0시
    # 오전 7시 - utc 22시 전날... 
    - cron: '0 22 * * *'
  workflow_dispatch:   # 수동 실행도 가능

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install jupyter nbconvert papermill

      - name: Execute notebook
        run: |
          DATE=$(date +'%Y%m%d')
          papermill az_nyse_001.ipynb az_nyse_001_out_${DATE}.ipynb

