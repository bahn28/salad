name: Test Notebook Run

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 KST 07:00 실행 (UTC 22:00)
  workflow_dispatch:       # 수동 실행도 가능

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install jupyter nbconvert papermill
          pip install matplotlib yfinance pandas numpy scipy 
          pip install statsmodels
          
      - name: Execute notebook
        run: |
          DATE=$(date +'%Y%m%d')
          papermill az_nyse_001.ipynb az_nyse_001_out_${DATE}.ipynb

